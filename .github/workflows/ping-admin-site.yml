name: Ping Website

on:
  schedule:
    # Run every 10 minutes (cron format: minute hour day month day-of-week)
    - cron: '*/10 * * * *'
  # Optional: Also allow manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://admin-backend-ywne.onrender.com
        # This sends a silent GET request and prints the HTTP response code (should be 200 for success)
